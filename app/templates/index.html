<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影片轉投影片</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="home">
<header class="topbar">
  <h1>影片轉投影片</h1>
</header>
<main class="container">
  <form id="job-form" class="panel job-form" novalidate>
    <label class="field field-url">
      <span>YouTube 網址</span>
      <input type="url" id="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
    </label>
    <label class="field">
      <span>畫質</span>
      <select id="quality" name="quality">
        {% for q in qualities %}<option value="{{ q }}"{% if q == 720 %} selected{% endif %}>{{ q }}p</option>{% endfor %}
      </select>
    </label>
    <label class="field">
      <span>目標語言</span>
      <select id="target-lang" name="target_lang">
        {% for code, name in langs.items() %}<option value="{{ code }}"{% if code == 'zh-TW' %} selected{% endif %}>{{ name }}</option>{% endfor %}
      </select>
    </label>
    <div class="deliver-options">
      <label class="check"><input type="checkbox" id="deliver-drive" value="drive"> 完成後存到 Google Drive</label>
      <small class="deliver-reason" id="deliver-drive-reason" hidden></small>
      <label class="check"><input type="checkbox" id="deliver-gmail" value="gmail"> 完成後寄到 Gmail</label>
      <small class="deliver-reason" id="deliver-gmail-reason" hidden></small>
    </div>
    <button type="submit" class="btn btn-primary" id="submit-btn">開始</button>
    <p class="form-error" id="form-error" role="alert" hidden></p>
  </form>

  <section aria-labelledby="active-title">
    <h2 id="active-title" class="section-title">處理中</h2>
    <div id="active-list" class="card-list"></div>
    <p class="empty" id="active-empty">目前沒有處理中的工作</p>
  </section>

  <section aria-labelledby="history-title">
    <h2 id="history-title" class="section-title">歷史紀錄</h2>
    <p class="form-error" id="list-error" role="alert" hidden></p>
    <div id="history-list" class="card-list"></div>
    <p class="empty" id="history-empty">還沒有任何紀錄</p>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
