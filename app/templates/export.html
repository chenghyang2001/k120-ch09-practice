<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --border: #dde1e8;
    --accent: #2563eb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --panel: #1d222b; --text: #e6e9ef; --muted: #98a1b3; --border: #2e3440;
            --accent: #60a5fa; --accent-text: #0b1220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { flex: 1 1 200px; margin: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .counter { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 64px; text-align: center; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .slide-img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #000; border-radius: 8px; }
  ul.cues { list-style: none; padding: 0; margin: 16px 0 0; }
  ul.cues li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); line-height: 1.6; }
  .ts { flex: none; color: var(--accent); text-decoration: none; font-variant-numeric: tabular-nums; }
  .tr { color: var(--muted); }
  .print-pages { display: none; }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; color: #000; }
    header, main { display: none; }
    .print-pages { display: block; }
    .print-page { break-after: page; }
    .print-page:last-child { break-after: auto; }
    .print-page h2 { margin: 0 0 4mm; font-size: 12pt; color: #555; }
    .print-page img { display: block; max-width: 100%; max-height: 120mm; margin: 0 auto; }
    .print-page ul.cues li { font-size: 10pt; padding: 1mm 0; border-color: #ddd; break-inside: avoid; }
    .print-page .tr { color: #444; }
    .print-page .ts { color: #1d4ed8; }
  }
</style>
</head>
<body>
<header>
  <h1>{{ title }}</h1>
  <button type="button" data-mode="orig">原文</button>
  <button type="button" data-mode="tr">譯文</button>
  <button type="button" data-mode="both">雙語</button>
  <button type="button" id="prev" aria-label="上一頁">‹</button>
  <span class="counter" id="counter"></span>
  <button type="button" id="next" aria-label="下一頁">›</button>
</header>
<main>
  <img class="slide-img" id="slide-img" alt="">
  <ul class="cues" id="cues"></ul>
</main>
<div class="print-pages" id="print-pages"></div>
<script type="application/json" id="export-data">{{ data_json | safe }}</script>
<script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('export-data').textContent);
  var slides = data.slides;
  var page = 0;
  var mode = 'both';

  function fmt(sec) {
    var t = Math.floor(sec || 0);
    var m = Math.floor(t / 60), s = t % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // 字幕一律 textContent，避免字幕內容被當 HTML 解析
  function renderCues(list, cues) {
    list.replaceChildren();
    cues.forEach(function (cue) {
      var li = el('li');
      var link = el('a', 'ts', fmt(cue.start));
      link.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(data.video_id) + '&t=' + Math.floor(cue.start) + 's';
      link.target = '_blank';
      link.rel = 'noopener';
      var body = el('div');
      var hasTr = cue.translation !== undefined && cue.translation !== null && cue.translation !== '';
      if (mode !== 'tr' || !hasTr) body.appendChild(el('div', 'orig', cue.text));
      if (mode !== 'orig' && hasTr) body.appendChild(el('div', 'tr', cue.translation));
      li.append(link, body);
      list.appendChild(li);
    });
  }

  function render() {
    var slide = slides[page];
    if (!slide) return;
    document.getElementById('slide-img').src = slide.image;
    document.getElementById('counter').textContent = (page + 1) + ' / ' + slides.length;
    renderCues(document.getElementById('cues'), slide.cues || []);
    document.querySelectorAll('[data-mode]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
  }

  function renderPrint() {
    var box = document.getElementById('print-pages');
    box.replaceChildren();
    slides.forEach(function (slide) {
      var sec = el('section', 'print-page');
      sec.appendChild(el('h2', null, slide.index + ' · ' + fmt(slide.start) + '–' + fmt(slide.end)));
      var img = el('img');
      img.src = slide.image;
      img.alt = '';
      var list = el('ul', 'cues');
      renderCues(list, slide.cues || []);
      sec.append(img, list);
      box.appendChild(sec);
    });
  }

  function go(n) { page = Math.max(0, Math.min(slides.length - 1, n)); render(); }

  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () { mode = b.dataset.mode; render(); renderPrint(); });
  });
  document.getElementById('prev').addEventListener('click', function () { go(page - 1); });
  document.getElementById('next').addEventListener('click', function () { go(page + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowLeft') go(page - 1);
    else if (e.key === 'ArrowRight') go(page + 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(slides.length - 1);
  });

  render();
  renderPrint();
})();
</script>
</body>
</html>
